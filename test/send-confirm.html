<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send confirm test</title>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div data-tid="chat-pane-item">
    <span data-tid="message-author-name">Sam</span>
    <div data-tid="chat-pane-message">Can we meet on Wednesday?</div>
  </div>
  <div class="compose">
    <div data-tid="ckeditor" contenteditable="true" role="textbox">sounds good</div>
    <div role="listbox"><div role="option" id="mention-sam">Sam Carter</div></div>
    <div class="toolbar"><button data-tid="newMessageCommands-send">Send</button></div>
  </div>
  <pre id="results"></pre>

  <script>
    const store = { apiKey: "dsk.localtestvalue.9f3a" };
    const storageListeners = [];
    const messageListeners = [];
    window.browser = {
      storage: {
        local: {
          get: async (defaults) => ({ ...defaults, ...store }),
          set: async (values) => {
            const changes = {};
            for (const [k, v] of Object.entries(values)) { changes[k] = { oldValue: store[k], newValue: v }; store[k] = v; }
            storageListeners.forEach((l) => l(changes, "local"));
          },
        },
        onChanged: { addListener: (l) => storageListeners.push(l) },
      },
      runtime: {
        onMessage: { addListener: (l) => messageListeners.push(l) },
        onInstalled: { addListener: () => {} },
        sendMessage: async (msg) => messageListeners[0](msg),
      },
      action: { setBadgeText: async () => {} },
    };
    window.copiedTexts = [];
    Object.defineProperty(navigator, "clipboard", { value: { writeText: async (t) => copiedTexts.push(t) } });

    // Stand-in for DeepSeek: fixed translations and check verdicts keyed on the text.
    window.draftCalls = [];
    window.checkCalls = [];
    const reply = (content) => new Response(JSON.stringify({ choices: [{ message: { content } }] }));
    const CHECKS = {
      "see you thursday": { verdict: "warn", issues: ["Sam 说的是周三，你写的是周四"], suggestion: "see you wednesday." },
      "here is the q3 salary sheet for the board": { verdict: "block", issues: ["这段对话里没人提到工资表，可能发错了对话"], suggestion: "" },
    };
    window.checkFails = false;
    window.fetch = async (url, init) => {
      const body = JSON.parse(init.body);
      const prompt = body.messages[1].content;
      if (prompt.includes("Draft to turn into English")) {
        draftCalls.push(body);
        const isRetry = body.messages.length > 2;
        if (prompt.endsWith("测试Test1")) return reply(isRetry ? "testing Test1" : "测试Test1");
        if (prompt.endsWith("一直中文")) return reply("一直中文");
        return reply("sure, will push it tomorrow.");
      }
      if (prompt.includes("Message the user is about to send")) {
        checkCalls.push(body);
        if (checkFails) return new Response("Service Unavailable", { status: 503 });
        const message = prompt.split("Message the user is about to send:\n")[1];
        return reply(JSON.stringify(CHECKS[message] ?? { verdict: "ok", issues: [], suggestion: "" }));
      }
      return reply("ZH");
    };

    // Stand-in for Teams: Enter in the editor or a click on the button sends the editor's text,
    // and Enter with a highlighted @mention picks the person instead.
    window.sent = [];
    window.pickedMentions = 0;
    const editor = document.querySelector("[data-tid=ckeditor]");
    const sendButton = document.querySelector("[data-tid=newMessageCommands-send]");
    editor.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
      if (editor.getAttribute("aria-activedescendant")) pickedMentions++;
      else sent.push(editor.innerText);
    });
    sendButton.addEventListener("click", () => sent.push(editor.innerText));
  </script>
  <script src="../settings.js"></script>
  <script src="../text.js"></script>
  <script src="../selectors.js"></script>
  <script src="../background.js"></script>
  <script src="../content.js"></script>
  <script src="../send-confirm.js"></script>
  <script>
    const results = [];
    const check = (name, ok, detail = "") => results.push(`${ok ? "PASS" : "FAIL"} ${name} ${ok ? "" : detail}`);
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const dialog = () => document.querySelector(".ctt-send-dialog");
    const inDialog = (selector) => dialog()?.querySelector(selector);
    const pressIn = (target, init) =>
      target.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, ...init }));
    const openWith = async (text) => {
      editor.innerText = text;
      pressIn(editor, { key: "Enter" });
      await wait(300);
    };
    const cancelDialog = () => inDialog(".ctt-send-cancel").click();

    async function run() {
      await wait(100);

      // Plain English
      editor.innerText = "sounds good";
      pressIn(editor, { key: "Enter" });
      check("Enter opens the dialog instead of sending", dialog() && sent.length === 0, JSON.stringify(sent));
      check("send is disabled while the check runs", inDialog(".ctt-send-confirm").disabled);
      await wait(300);
      check("dialog shows the message in an editable box", inDialog(".ctt-send-message").value === "sounds good");
      check("check passed is shown and send is focused",
        inDialog(".ctt-check-ok")?.textContent === "检查通过" && document.activeElement === inDialog(".ctt-send-confirm"));
      check("check request carries the message and the conversation",
        checkCalls.at(-1).messages[1].content.includes("[Sam]: Can we meet on Wednesday?")
          && checkCalls.at(-1).messages[1].content.endsWith("sounds good")
          && checkCalls.at(-1).temperature === 0);
      check("plain English check has no draft and no translation rule, and short replies must answer something",
        !checkCalls.at(-1).messages[1].content.includes("Chinese draft")
          && !checkCalls.at(-1).messages[0].content.includes("does not say what the draft says")
          && checkCalls.at(-1).messages[0].content.includes("must answer something in the conversation")
          && !checkCalls.at(-1).messages[0].content.includes("such as ok or thanks, are fine"));
      inDialog(".ctt-send-confirm").click();
      await wait(100);
      check("confirming sends exactly once", JSON.stringify(sent) === '["sounds good"]' && !dialog(), JSON.stringify(sent));

      await openWith("sounds good");
      pressIn(dialog(), { key: "Escape" });
      check("Escape cancels without sending", !dialog() && sent.length === 1, JSON.stringify(sent));
      check("cancel returns focus to the editor", document.activeElement === editor);

      sendButton.click();
      await wait(300);
      check("send button click opens the dialog", dialog() && sent.length === 1, JSON.stringify(sent));
      inDialog(".ctt-send-confirm").click();
      await wait(100);
      check("confirming a button click sends once", sent.length === 2, JSON.stringify(sent));

      await openWith("sounds good");
      pressIn(editor, { key: "Enter" });
      check("a second Enter while the dialog is open does not send or stack dialogs",
        document.querySelectorAll(".ctt-send-dialog").length === 1 && sent.length === 2);
      cancelDialog();

      pressIn(editor, { key: "Enter", shiftKey: true });
      check("Shift+Enter is left alone", !dialog());
      pressIn(editor, { key: "Enter", isComposing: true });
      check("Enter while an input method is composing is left alone", !dialog());

      // Warn with a suggestion
      await openWith("see you thursday");
      check("contradiction is shown as a warning with the issue",
        inDialog(".ctt-check-warn")?.textContent.includes("Sam 说的是周三"), inDialog(".ctt-send-check")?.textContent);
      check("suggestion is offered without a closing full stop",
        inDialog(".ctt-check-suggestion")?.firstChild.textContent === "see you wednesday");
      inDialog(".ctt-use-suggestion").click();
      check("using the suggestion puts it in the message box", inDialog(".ctt-send-message").value === "see you wednesday");
      inDialog(".ctt-send-confirm").click();
      await wait(300);
      check("the corrected message replaces the editor text and is sent",
        sent.at(-1) === "see you wednesday" && !dialog(), JSON.stringify(sent));

      // Block
      const sentBeforeBlock = sent.length;
      await openWith("here is the q3 salary sheet for the board");
      check("wrong chat is blocked and the send button asks to send anyway",
        inDialog(".ctt-check-block") && inDialog(".ctt-send-confirm").textContent === "仍然发送");
      check("blocked message focuses cancel, not send", document.activeElement === inDialog(".ctt-send-cancel"));
      pressIn(inDialog(".ctt-send-message"), { key: "Enter" });
      await wait(100);
      check("Enter in the box does not send a blocked message", dialog() && sent.length === sentBeforeBlock);
      inDialog(".ctt-send-confirm").click();
      await wait(100);
      check("clicking send anyway sends it", sent.length === sentBeforeBlock + 1);

      // Local secret check
      const checksBeforeSecret = checkCalls.length;
      const draftsBeforeSecret = draftCalls.length;
      await openWith("the key is sk-abcdefghijklmnopqrstuvwx123");
      check("a secret is blocked locally without calling DeepSeek",
        inDialog(".ctt-check-block") && checkCalls.length === checksBeforeSecret && draftCalls.length === draftsBeforeSecret);
      cancelDialog();
      await openWith("用这个 key dsk.localtestvalue.9f3a");
      check("the user's own DeepSeek key is caught and not sent for translation",
        inDialog(".ctt-check-block") && draftCalls.length === draftsBeforeSecret);
      cancelDialog();

      // Check failure
      checkFails = true;
      await openWith("sounds good");
      check("failed check says so and still allows sending",
        inDialog(".ctt-send-check").textContent.startsWith("检查失败") && !inDialog(".ctt-send-confirm").disabled);
      cancelDialog();
      checkFails = false;

      // Chinese drafts
      editor.innerText = "好的，明天推";
      pressIn(editor, { key: "Enter" });
      check("Chinese draft opens the translate dialog with send disabled",
        inDialog(".ctt-heading").textContent === "翻译成英文后发送" && inDialog(".ctt-send-confirm").disabled);
      await wait(300);
      check("English shown without a closing full stop and send enabled",
        inDialog(".ctt-send-message").value === "sure, will push it tomorrow" && !inDialog(".ctt-send-confirm").disabled,
        inDialog(".ctt-send-message").value);
      check("translation request carries the draft and the conversation",
        draftCalls.at(-1).messages[1].content.includes("[Sam]: Can we meet on Wednesday?")
          && draftCalls.at(-1).messages[1].content.endsWith("好的，明天推"));
      check("the English is checked together with the Chinese draft",
        checkCalls.at(-1).messages[1].content.endsWith("sure, will push it tomorrow")
          && checkCalls.at(-1).messages[1].content.includes("The user's Chinese draft:\n好的，明天推")
          && checkCalls.at(-1).messages[0].content.includes("does not say what the draft says"));
      check("translation prompt forbids inventing a better-fitting meaning",
        draftCalls.at(-1).messages[0].content.includes("never something that would fit the conversation better"));
      inDialog(".ctt-send-confirm").click();
      await wait(300);
      check("confirming replaces the editor text and sends the English",
        sent.at(-1) === "sure, will push it tomorrow" && !dialog(), JSON.stringify(sent));

      await openWith("ok 我晚点看");
      check("mixed English and Chinese is translated too", inDialog(".ctt-send-preview")?.textContent === "ok 我晚点看");
      const sentBefore = sent.length;
      inDialog(".ctt-send-message").value = "ok 我晚点看";
      inDialog(".ctt-send-confirm").click();
      await wait(100);
      check("English still containing Chinese is not sent",
        sent.length === sentBefore && inDialog(".ctt-send-status").textContent.includes("还有中文"));
      inDialog(".ctt-send-message").value = "ok, will look later";
      const realExecCommand = document.execCommand;
      document.execCommand = () => false;
      inDialog(".ctt-send-confirm").click();
      await wait(300);
      document.execCommand = realExecCommand;
      check("editor that rejects the new text: nothing sent, text copied, user told",
        sent.length === sentBefore && copiedTexts.at(-1) === "ok, will look later"
          && inDialog(".ctt-send-status").textContent.includes("没有发送"),
        inDialog(".ctt-send-status").textContent);
      cancelDialog();

      const draftCallsBefore = draftCalls.length;
      await openWith("测试Test1");
      check("draft handed back in Chinese is retried once and becomes English",
        inDialog(".ctt-send-message").value === "testing Test1" && draftCalls.length === draftCallsBefore + 2
          && draftCalls.at(-1).messages.at(-1).content.includes("still contains Chinese"),
        inDialog(".ctt-send-message").value);
      cancelDialog();

      const checksBeforeChinese = checkCalls.length;
      await openWith("一直中文");
      check("translation still Chinese after the retry: user told, not checked",
        inDialog(".ctt-send-status").textContent.includes("还有中文")
          && document.activeElement === inDialog(".ctt-send-message") && checkCalls.length === checksBeforeChinese);
      cancelDialog();

      await openWith("ok，sure");
      check("full-width Chinese punctuation counts as Chinese", inDialog(".ctt-send-preview") !== null);
      cancelDialog();
      await openWith("sure, “soon”…");
      check("curly quotes and ellipsis in English do not trigger translation",
        dialog() && inDialog(".ctt-send-preview") === null);
      cancelDialog();

      // @mentions
      editor.innerText = "sounds good @Ma";
      editor.setAttribute("aria-activedescendant", "mention-sam");
      const sentBeforeMention = sent.length;
      pressIn(editor, { key: "Enter" });
      check("Enter with the mention list open picks the person, no dialog, nothing sent",
        !dialog() && pickedMentions === 1 && sent.length === sentBeforeMention);
      editor.setAttribute("aria-activedescendant", "no-such-option");
      pressIn(editor, { key: "Enter" });
      check("a stale mention id does not bypass the dialog", Boolean(dialog()) && sent.length === sentBeforeMention);
      cancelDialog();
      editor.removeAttribute("aria-activedescendant");
      // Let the cancelled dialog's check finish so it is not counted below.
      await wait(300);

      // Settings
      await browser.storage.local.set({ checkBeforeSend: false });
      const checksBeforeOff = checkCalls.length;
      await openWith("sounds good");
      check("check turned off: no check call and no check box",
        checkCalls.length === checksBeforeOff && inDialog(".ctt-send-check").hidden);
      cancelDialog();

      await browser.storage.local.set({ confirmBeforeSend: false });
      const sentBeforeOff = sent.length;
      pressIn(editor, { key: "Enter" });
      sendButton.click();
      check("confirm turned off: Enter and button send directly", !dialog() && sent.length === sentBeforeOff + 2);

      document.getElementById("results").textContent = results.join("\n");
      window.testResults = results;
    }
    run();
  </script>
</body>
</html>
