<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fake Teams test</title>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div id="chat">
    <div data-tid="chat-pane-item">
      <span data-tid="message-author-name">Alice</span>
      <div data-tid="chat-pane-message">Can you push the fix to staging before EOD?</div>
    </div>
    <div data-tid="chat-pane-item">
      <div data-tid="chat-pane-message">It blocks the demo tomorrow.</div>
    </div>
    <div data-tid="chat-pane-item">
      <span data-tid="message-author-name">Bob</span>
      <div data-tid="chat-pane-message">好的，我马上处理</div>
    </div>
  </div>
  <pre id="results"></pre>

  <script src="deepseek-stub.js"></script>
  <script>
    // Stand-in for the WebExtension API: storage in memory, sendMessage routed to background.js's listener.
    const store = { apiKey: "test-key", myName: "Dana", insightContextMessageCount: 2 };
    const storageListeners = [];
    const messageListeners = [];
    window.browser = {
      storage: {
        local: {
          get: async (defaults) => ({ ...defaults, ...store }),
          set: async (values) => {
            const changes = {};
            for (const [k, v] of Object.entries(values)) { changes[k] = { oldValue: store[k], newValue: v }; store[k] = v; }
            storageListeners.forEach((l) => l(changes, "local"));
          },
        },
        onChanged: { addListener: (l) => storageListeners.push(l) },
      },
      runtime: {
        onMessage: { addListener: (l) => messageListeners.push(l) },
        onInstalled: { addListener: () => {} },
        onConnect: { addListener: () => {} },
        getManifest: () => ({ version: "test" }),
        sendMessage: async (msg) => messageListeners[0](msg),
      },
      action: { setBadgeText: async () => {} },
    };
    // Headless panes never report intersections, so every observed element counts as visible.
    window.IntersectionObserver = class {
      constructor(callback) { this.callback = callback; }
      observe(target) { setTimeout(() => this.callback([{ target, isIntersecting: true }]), 0); }
      unobserve() {}
    };
    window.copiedTexts = [];
    Object.defineProperty(navigator, "clipboard", { value: { writeText: async (t) => copiedTexts.push(t) } });
    window.fetchCalls = [];
    window.fetch = async (url, init) => {
      const body = JSON.parse(init.body);
      fetchCalls.push({ url, headers: init.headers, body });
      if (body.response_format?.type === "json_object") {
        return streamed(JSON.stringify({
          explanation: "对方在催你今天下班前部署",
          replies: [
            { english: "Sure, will do.", translation: "好的，马上办。" },
            { english: "Which branch?", translation: "哪个分支？" },
            { english: "On it...", translation: "在弄了..." },
          ],
        }));
      }
      const prompt = body.messages[1].content;
      const target = prompt.split("Message to translate:\n")[1];
      return streamed(`ZH(${target})`);
    };
  </script>
  <script src="../settings.js"></script>
  <script src="../text.js"></script>
  <script src="../selectors.js"></script>
  <script src="../background.js"></script>
  <script src="../content.js"></script>
  <script>
    const results = [];
    const check = (name, ok, detail = "") => results.push(`${ok ? "PASS" : "FAIL"} ${name} ${ok ? "" : detail}`);
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const boxes = () => [...document.querySelectorAll(".ctt-translation")].map((b) => (b.querySelector(".ctt-text") ?? b).textContent);

    async function run() {
      const goodFetch = window.fetch;
      await wait(300);
      check("translates English messages and skips Chinese", boxes().length === 2, JSON.stringify(boxes()));
      check("second message inherits author Alice", boxes()[1] === "ZH([Alice]: It blocks the demo tomorrow.)", boxes()[1]);
      const second = fetchCalls.find((c) => c.body.messages[1].content.includes("It blocks"));
      check("context includes the earlier message",
        second.body.messages[1].content.includes("[Alice]: Can you push the fix to staging before EOD?"));
      check("sends bearer key to DeepSeek",
        second.url === "https://api.deepseek.com/chat/completions" && second.headers.Authorization === "Bearer test-key");
      check("system prompt names target language", second.body.messages[0].content.includes("简体中文"));

      await browser.storage.local.set({ enabled: false });
      const item = document.createElement("div");
      item.setAttribute("data-tid", "chat-pane-item");
      item.innerHTML = '<span data-tid="message-author-name">Carol</span><div data-tid="chat-pane-message">Thanks both!</div>';
      document.getElementById("chat").append(item);
      await wait(300);
      check("paused: new message not translated", boxes().length === 2, JSON.stringify(boxes()));

      await browser.storage.local.set({ enabled: true });
      await wait(300);
      check("resumed: waiting message translated", boxes().length === 3, JSON.stringify(boxes()));
      const carol = fetchCalls.at(-1).body.messages[1].content;
      check("context keeps the Chinese message for reference", carol.includes("[Bob]: 好的，我马上处理"), carol);

      const callsBefore = fetchCalls.length;
      const dup = item.cloneNode(true);
      dup.querySelector("[data-tid=chat-pane-message]").removeAttribute("data-ctt-state");
      dup.querySelector(".ctt-translation")?.remove();
      document.getElementById("chat").append(dup);
      await wait(300);
      check("re-rendered identical message uses cache", fetchCalls.length === callsBefore && boxes().length === 4);

      const carolBox = document.querySelectorAll(".ctt-translation")[2];
      carolBox.querySelector(".ctt-insight-button").click();
      await wait(300);
      const panel = carolBox.nextElementSibling;
      check("insight panel shows explanation and replies",
        panel.classList.contains("ctt-insight") && panel.textContent.includes("对方在催你今天下班前部署")
          && panel.querySelectorAll(".ctt-reply").length === 3, panel.textContent);
      const insightCall = fetchCalls.at(-1).body;
      check("insight prompt explains the user marker", insightCall.messages[0].content.includes('"(the user)"'));
      check("insight uses deepseek-flash with thinking turned off",
        insightCall.model === "deepseek-flash" && insightCall.thinking?.type === "disabled", JSON.stringify(insightCall.model));
      check("translation uses deepseek-flash with thinking turned off",
        second.body.model === "deepseek-flash" && second.body.thinking?.type === "disabled");
      store.model = "deepseek-chat";
      check("a retired model name saved in settings is replaced", (await loadSettings()).model === "deepseek-flash");
      store.model = "deepseek-v4-pro";
      check("a current model name chosen by the user is kept", (await loadSettings()).model === "deepseek-v4-pro");
      delete store.model;
      check("insight panel has no debug details", !panel.querySelector("details"));
      check("insight prompt asks to spell out jokes and who is addressed",
        insightCall.messages[0].content.includes("spell out the joke")
          && insightCall.messages[0].content.includes("who is talking to whom"));
      check("insight uses its own context size",
        insightCall.messages[1].content.includes("[Bob]") && !insightCall.messages[1].content.includes("Can you push"),
        insightCall.messages[1].content);
      panel.querySelector(".ctt-button").click();
      await wait(50);
      check("copy button copies the English reply", copiedTexts[0] === "Sure, will do", JSON.stringify(copiedTexts));
      const replyTexts = [...panel.querySelectorAll(".ctt-reply-english")].map((r) => r.firstChild.textContent);
      check("closing full stop removed, question mark and ellipsis kept",
        JSON.stringify(replyTexts) === JSON.stringify(["Sure, will do", "Which branch?", "On it..."]), JSON.stringify(replyTexts));
      check("replies are grounded in the conversation and the user's own voice",
        insightCall.messages[0].content.includes("A reply that could be pasted into any other chat is wrong")
          && insightCall.messages[0].content.includes("match their voice")
          && !insightCall.messages[0].content.includes("politely defer"));
      check("reply style asks for casual replies without a full stop",
        insightCall.messages[0].content.includes("do not end a reply with a full stop"));
      carolBox.querySelector(".ctt-insight-button").click();
      check("second click hides the panel", panel.hidden === true);

      const aliceBox = document.querySelectorAll(".ctt-translation")[1];
      window.fetch = async () => streamed('{"explanation": 1}');
      aliceBox.querySelector(".ctt-insight-button").click();
      await wait(300);
      check("malformed insight shows an error", aliceBox.nextElementSibling.textContent.startsWith("分析失败"),
        aliceBox.nextElementSibling.textContent);

      window.fetch = async () => new Response("Insufficient Balance", { status: 402 });
      const bad = document.createElement("div");
      bad.setAttribute("data-tid", "chat-pane-item");
      bad.innerHTML = '<div data-tid="chat-pane-message">One more thing</div>';
      document.getElementById("chat").append(bad);
      await wait(300);
      check("API error shown in box", boxes().at(-1).startsWith("翻译失败: DeepSeek HTTP 402"), boxes().at(-1));

      window.fetch = goodFetch;
      const addMessage = (html) => {
        const node = document.createElement("div");
        node.setAttribute("data-tid", "chat-pane-item");
        node.innerHTML = `<div data-tid="chat-pane-message">${html}</div>`;
        document.getElementById("chat").append(node);
      };
      const lastTranslated = () => fetchCalls.at(-1).body.messages[1].content.split("Message to translate:\n")[1];
      addMessage('Looks good<div><button data-tid="diverse-reaction-pill-button">\u{1F440} 1</button>'
        + '<span data-tid="reaction-summary">1 Eyes reaction.</span></div>');
      await wait(300);
      check("reactions are not part of the translated text", lastTranslated().endsWith("]: Looks good"), lastTranslated());

      const callsBeforeEmoji = fetchCalls.length;
      addMessage('<img alt="\u{1F44D}" itemtype="http://schema.skype.com/Emoji">');
      await wait(300);
      check("emoji-only message is not translated", fetchCalls.length === callsBeforeEmoji
        && document.querySelectorAll('[data-ctt-state="skipped"]').length === 2);

      addMessage("<p>Line one</p><p>Line two</p>");
      await wait(300);
      check("line breaks between paragraphs are kept", lastTranslated().endsWith("]: Line one\nLine two"), lastTranslated());

      const own = document.createElement("div");
      own.setAttribute("data-tid", "chat-pane-item");
      own.innerHTML = '<div class="fui-ChatMyMessage"><div data-tid="chat-pane-message">I will handle it</div></div>';
      document.getElementById("chat").append(own);
      await wait(300);
      check("own message is attributed to the user, not the previous sender",
        lastTranslated() === "[Dana (the user)]: I will handle it", lastTranslated());

      addMessage("Great, thanks");
      await wait(300);
      const afterOwn = fetchCalls.at(-1).body.messages[1].content;
      check("sender after own message keeps their own name", lastTranslated().startsWith("[Carol]"), lastTranslated());
      check("context marks the user's message", afterOwn.includes("[Dana (the user)]: I will handle it"), afterOwn);

      const named = document.createElement("div");
      named.setAttribute("data-tid", "chat-pane-item");
      named.innerHTML = '<span data-tid="message-author-name">Dana</span><div data-tid="chat-pane-message">Also the docs</div>';
      document.getElementById("chat").append(named);
      await wait(300);
      check("message under the configured name counts as the user's", lastTranslated() === "[Dana (the user)]: Also the docs", lastTranslated());

      const thread = document.createElement("div");
      thread.innerHTML = '<div class="post"><div class="header"><span data-tid="message-author-name">Sam</span></div>'
        + '<div role="group"><div class="bubble"><div data-tid="chat-pane-message">You made the train?!</div></div></div></div>'
        + '<div class="post"><div class="header"><span data-tid="message-author-name">Kai</span></div>'
        + '<div role="group"><div class="bubble"><div data-tid="chat-pane-message">no, the factory built it</div></div></div></div>';
      document.getElementById("chat").append(thread);
      await wait(300);
      const kaiCall = fetchCalls.at(-1).body.messages[1].content;
      check("channel thread: names found outside the body's wrapper",
        kaiCall.includes("[Sam]: You made the train?!") && kaiCall.endsWith("[Kai]: no, the factory built it"), kaiCall);
      check("insight prompt mentions idioms taken literally",
        buildInsightPrompt({ message: { text: "x" }, context: [] }, DEFAULT_SETTINGS)[0].content.includes("phrasal verb"));

      const ownBox = own.querySelector(".ctt-translation");
      const ownButton = ownBox.querySelector(".ctt-insight-button");
      check("own translation uses the user's bubble colour, others' do not",
        ownBox.classList.contains("ctt-mine") && !carolBox.classList.contains("ctt-mine"));
      check("own message button is an i with a wording-check tooltip",
        ownButton.textContent === "i" && ownButton.title === "检查我的表达", ownButton.title);
      check("others' button is an i with an insight tooltip",
        carolBox.querySelector(".ctt-insight-button").title === "解读 & 建议回复");
      ownButton.click();
      await wait(300);
      const ownPanel = ownBox.nextElementSibling;
      check("own message panel shows rewrites", ownPanel.textContent.includes("更好的说法"), ownPanel.textContent);
      check("own message insight asks for rewrites",
        fetchCalls.at(-1).body.messages[0].content.includes("The focus message was written by the user"));

      window.fetch = async () => { throw new DOMException("The operation was aborted.", "AbortError"); };
      const timeoutError = await translate({ message: { author: "A", text: "hello" }, context: [] }).catch((e) => e);
      check("a timeout is reported in plain words with the model",
        timeoutError.message.includes("秒内没有回应") && timeoutError.message.includes("deepseek-flash"), timeoutError.message);

      window.fetch = async (url, init) => {
        if (url.endsWith("/models")) {
          return new Response(JSON.stringify({ data: [{ id: "deepseek-flash" }, { id: "deepseek-v4-pro" }] }));
        }
        return streamed("你能在下班前把修复推到预发布吗？", { reasoning: window.diagnoseReasoning ?? "" });
      };
      const lines = [];
      await diagnose((line) => lines.push(line));
      const report = lines.join("\n");
      check("diagnostics list the available models, the status, thinking and the translation",
        report.includes("可用的模型: deepseek-flash, deepseek-v4-pro") && report.includes("翻译请求: HTTP 200")
          && report.includes("思考 0 字") && report.includes("译文: 你能在下班前把修复推到预发布吗？")
          && !report.includes("开始思考"), report);
      window.diagnoseReasoning = "Let me think about this sentence";
      const thinkingLines = [];
      await diagnose((line) => thinkingLines.push(line));
      check("diagnostics show when the model is thinking",
        thinkingLines.some((line) => line.includes("开始思考")) && thinkingLines.some((line) => line.includes("思考 32 字")),
        thinkingLines.join("\n"));
      delete window.diagnoseReasoning;
      store.model = "my-old-model";
      const staleLines = [];
      await diagnose((line) => staleLines.push(line));
      check("diagnostics point out a model the account does not have",
        staleLines.some((line) => line.includes("my-old-model 不在这个列表里")), staleLines.join("\n"));
      delete store.model;

      document.getElementById("results").textContent = results.join("\n");
      window.testResults = results;
    }
    run();
  </script>
</body>
</html>
