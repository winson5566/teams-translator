<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Writer test</title>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div data-tid="chat-pane-item">
    <span data-tid="message-author-name">Sam</span>
    <div data-tid="chat-pane-message">Can we meet on Wednesday?</div>
  </div>
  <div class="compose">
    <div data-tid="ckeditor" contenteditable="true" role="textbox">sounds good</div>
    <div role="listbox"><div role="option" id="mention-sam">Sam Carter</div></div>
    <div class="toolbar"><button data-tid="newMessageCommands-send">Send</button></div>
  </div>
  <pre id="results"></pre>

  <script src="deepseek-stub.js"></script>
  <script>
    const store = { apiKey: "dsk.localtestvalue.9f3a" };
    const storageListeners = [];
    const messageListeners = [];
    window.browser = {
      storage: {
        local: {
          get: async (defaults) => ({ ...defaults, ...store }),
          set: async (values) => {
            const changes = {};
            for (const [k, v] of Object.entries(values)) { changes[k] = { oldValue: store[k], newValue: v }; store[k] = v; }
            storageListeners.forEach((l) => l(changes, "local"));
          },
        },
        onChanged: { addListener: (l) => storageListeners.push(l) },
      },
      runtime: {
        id: "test-extension",
        onMessage: { addListener: (l) => messageListeners.push(l) },
        onInstalled: { addListener: () => {} },
        onConnect: { addListener: () => {} },
        sendMessage: (msg) => new Promise((resolve) => messageListeners[0](msg, {}, resolve)),
      },
      action: { setBadgeText: async () => {} },
    };
    window.copiedTexts = [];
    Object.defineProperty(navigator, "clipboard", { value: { writeText: async (t) => copiedTexts.push(t) } });

    // Stand-in for DeepSeek: fixed translations and check verdicts keyed on the text.
    window.draftCalls = [];
    window.checkCalls = [];
    const reply = (content) => streamed(content);
    const CHECKS = {
      "see you thursday": { verdict: "warn", issues: ["Sam 说的是周三，你写的是周四"], suggestion: "see you wednesday." },
      "here is the q3 salary sheet for the board": { verdict: "block", issues: ["这段对话里没人提到工资表，可能发错了对话"], suggestion: "" },
    };
    window.checkFails = false;
    window.fetch = async (url, init) => {
      const body = JSON.parse(init.body);
      const prompt = body.messages[1].content;
      if (prompt.includes("Draft to turn into English")) {
        draftCalls.push(body);
        const isRetry = body.messages.length > 2;
        if (prompt.endsWith("测试Test1")) return reply(isRetry ? "testing Test1" : "测试Test1");
        if (prompt.endsWith("一直中文")) return reply("一直中文");
        return reply("sure, will push it tomorrow.");
      }
      if (prompt.includes("Message the user is about to send")) {
        checkCalls.push(body);
        if (checkFails) return new Response("Service Unavailable", { status: 503 });
        const message = prompt.split("Message the user is about to send:\n")[1];
        return reply(JSON.stringify(CHECKS[message] ?? { verdict: "ok", issues: [], suggestion: "" }));
      }
      return reply("ZH");
    };

    // Stand-in for Teams: Enter in the editor or a click on the button sends the editor's text,
    // and Enter with a highlighted @mention picks the person instead.
    window.sent = [];
    window.pickedMentions = 0;
    const editor = document.querySelector("[data-tid=ckeditor]");
    const sendButton = document.querySelector("[data-tid=newMessageCommands-send]");
    editor.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
      if (editor.getAttribute("aria-activedescendant")) pickedMentions++;
      else sent.push(editor.innerText);
    });
    sendButton.addEventListener("click", () => sent.push(editor.innerText));
  </script>
  <script src="../settings.js"></script>
  <script src="../text.js"></script>
  <script src="../selectors.js"></script>
  <script src="../background.js"></script>
  <script src="../content.js"></script>
  <script src="../writer.js"></script>
  <script>
    const results = [];
    const check = (name, ok, detail = "") => results.push(`${ok ? "PASS" : "FAIL"} ${name} ${ok ? "" : detail}`);
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const pressIn = (target, init) =>
      target.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, ...init }));
    const fab = () => document.querySelector(".ctt-writer-fab");
    const panel = () => document.querySelector(".ctt-writer");
    const inPanel = (selector) => panel().querySelector(selector);
    const write = async (text) => {
      inPanel(".ctt-writer-draft").value = text;
      inPanel(".ctt-writer-run").click();
      await wait(300);
    };
    const english = () => inPanel(".ctt-writer-english").value;

    async function run() {
      await wait(300);

      // Floating button and panel
      check("one floating button and a hidden panel are on the page",
        document.querySelectorAll(".ctt-writer-fab").length === 1 && panel().hidden);
      check("nothing is added next to Teams' message box", editor.nextElementSibling?.getAttribute("role") === "listbox");
      fab().click();
      check("the button opens the panel with the cursor in the draft box",
        !panel().hidden && document.activeElement === inPanel(".ctt-writer-draft"));
      fab().click();
      check("clicking it again closes the panel", panel().hidden);
      fab().click();

      // English: check only
      inPanel(".ctt-writer-draft").value = "sounds good";
      inPanel(".ctt-writer-run").click();
      check("the run button is disabled while working", inPanel(".ctt-writer-run").disabled);
      await wait(300);
      check("English is kept as is and the check passes",
        english() === "sounds good" && inPanel(".ctt-check-ok")?.textContent === "检查通过" && draftCalls.length === 0);
      check("check request carries the message and the open conversation",
        checkCalls.at(-1).messages[1].content.includes("[Sam]: Can we meet on Wednesday?")
          && checkCalls.at(-1).messages[1].content.endsWith("sounds good") && checkCalls.at(-1).temperature === 0
          && !checkCalls.at(-1).messages[1].content.includes("Chinese draft"));
      inPanel(".ctt-writer-copy").click();
      await wait(50);
      check("copy puts the English on the clipboard", copiedTexts.at(-1) === "sounds good"
        && inPanel(".ctt-writer-copy").textContent === "已复制");
      check("Teams' box and sent messages are never touched", editor.innerText === "sounds good" && sent.length === 0);

      // Chinese: translate then check
      await write("好的，明天推");
      check("Chinese is translated without a closing full stop", english() === "sure, will push it tomorrow", english());
      check("translation request carries the draft and the conversation",
        draftCalls.at(-1).messages[1].content.includes("[Sam]: Can we meet on Wednesday?")
          && draftCalls.at(-1).messages[1].content.endsWith("好的，明天推")
          && draftCalls.at(-1).messages[0].content.includes("never something that would fit the conversation better"));
      check("the English is checked together with the Chinese draft",
        checkCalls.at(-1).messages[1].content.endsWith("sure, will push it tomorrow")
          && checkCalls.at(-1).messages[1].content.includes("The user's Chinese draft:\n好的，明天推"));
      inPanel(".ctt-writer-copy").click();
      await wait(50);
      check("copy gives the English", copiedTexts.at(-1) === "sure, will push it tomorrow");

      inPanel(".ctt-writer-draft").value = "好的";
      pressIn(inPanel(".ctt-writer-draft"), { key: "Enter", ctrlKey: true });
      await wait(300);
      check("Ctrl+Enter in the draft box runs it", english() === "sure, will push it tomorrow" && draftCalls.length === 2);
      let reachedPage = false;
      const spy = () => (reachedPage = true);
      document.addEventListener("keydown", spy);
      pressIn(inPanel(".ctt-writer-draft"), { key: "a" });
      document.removeEventListener("keydown", spy);
      check("keys typed in the panel do not reach Teams", !reachedPage);

      // Warn and block
      await write("see you thursday");
      check("contradiction is shown as a warning", inPanel(".ctt-check-warn")?.textContent.includes("Sam 说的是周三"));
      inPanel(".ctt-use-suggestion").click();
      check("the suggestion replaces the English without a full stop", english() === "see you wednesday");
      await write("here is the q3 salary sheet for the board");
      check("wrong chat is blocked and copy says copy anyway",
        inPanel(".ctt-check-block") && inPanel(".ctt-writer-copy").textContent === "仍然复制");

      // Secrets, failures, stubborn Chinese
      const checksBefore = checkCalls.length;
      const draftsBefore = draftCalls.length;
      await write("the key is sk-abcdefghijklmnopqrstuvwx123");
      check("a secret is blocked locally without calling DeepSeek",
        inPanel(".ctt-check-block") && checkCalls.length === checksBefore && draftCalls.length === draftsBefore);
      await write("用这个 key dsk.localtestvalue.9f3a");
      check("the user's own DeepSeek key is caught before translation", inPanel(".ctt-check-block") && draftCalls.length === draftsBefore);
      checkFails = true;
      await write("sounds good");
      check("a failed check says so and copying still works",
        inPanel(".ctt-send-check").textContent.startsWith("检查失败") && english() === "sounds good");
      checkFails = false;
      await write("测试Test1");
      check("a draft handed back in Chinese is retried once", english() === "testing Test1"
        && draftCalls.at(-1).messages.at(-1).content.includes("still contains Chinese"));
      const checksBeforeStubborn = checkCalls.length;
      await write("一直中文");
      check("translation still Chinese: user told, not checked",
        inPanel(".ctt-send-status").textContent.includes("还有中文") && checkCalls.length === checksBeforeStubborn);
      inPanel(".ctt-writer-copy").click();
      await wait(50);
      check("English still containing Chinese is not copied", copiedTexts.at(-1) !== "一直中文");
      await write("sure, “soon”…");
      check("curly quotes and ellipsis count as English", english() === "sure, “soon”…" && draftCalls.length === draftsBefore + 4);

      // Sending from Teams
      panel().hidden = true;
      editor.innerText = "sounds good";
      pressIn(editor, { key: "Enter" });
      sendButton.click();
      check("English in Teams' box sends normally", JSON.stringify(sent) === '["sounds good","sounds good"]');
      editor.innerText = "好的，明天推";
      pressIn(editor, { key: "Enter" });
      await wait(300);
      check("Chinese in Teams' box is not sent", sent.length === 2);
      check("the panel opens with the draft, a notice, and the translation",
        !panel().hidden && inPanel(".ctt-writer-draft").value === "好的，明天推" && !inPanel(".ctt-writer-notice").hidden
          && english() === "sure, will push it tomorrow");
      editor.innerText = "ok，sure";
      sendButton.click();
      await wait(300);
      check("Chinese punctuation also stops the send button", sent.length === 2 && inPanel(".ctt-writer-draft").value === "ok，sure");
      editor.innerText = "好的";
      pressIn(editor, { key: "Enter", shiftKey: true });
      pressIn(editor, { key: "Enter", isComposing: true });
      check("Shift+Enter and input-method Enter are left alone", sent.length === 2 && inPanel(".ctt-writer-draft").value === "ok，sure");
      editor.setAttribute("aria-activedescendant", "mention-sam");
      pressIn(editor, { key: "Enter" });
      check("Enter with the mention list open picks the person", pickedMentions === 1);
      editor.setAttribute("aria-activedescendant", "no-such-option");
      pressIn(editor, { key: "Enter" });
      check("a stale mention id does not let Chinese through", sent.length === 2 && pickedMentions === 1);
      editor.removeAttribute("aria-activedescendant");
      await wait(300);
      window.postMessage({ type: "ctt-take-over-draft", text: "来自框架" }, "*");
      await wait(50);
      check("the panel ignores take-over messages from its own window", inPanel(".ctt-writer-draft").value !== "来自框架");

      // Size
      check("the window opens 400 wide and as tall as the screen allows up to 600",
        panel().offsetWidth === 400 && panel().offsetHeight === Math.min(600, innerHeight - 40),
        `${panel().offsetWidth}x${panel().offsetHeight}`);
      panel().style.width = "450px";
      panel().style.height = "420px";
      await wait(700);
      check("a resized window's size is saved", store.writerSize?.width === 450 && store.writerSize?.height === 420,
        JSON.stringify(store.writerSize));
      panel().style.width = "";
      panel().style.height = "";
      inPanel(".ctt-writer-close").click();
      fab().click();
      check("reopening restores the saved size", panel().offsetWidth === 450 && panel().offsetHeight === 420);

      // Dragging
      const pointer = (target, type, x, y) =>
        target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, button: 0, clientX: x, clientY: y }));
      const header = inPanel(".ctt-writer-header");
      const before = panel().getBoundingClientRect();
      pointer(header, "pointerdown", before.left + 20, before.top + 10);
      pointer(document, "pointermove", before.left - 80, before.top - 40);
      pointer(document, "pointerup", before.left - 80, before.top - 40);
      await wait(50);
      const after = panel().getBoundingClientRect();
      check("dragging the header moves the window and saves where it went",
        Math.round(before.left - after.left) === 100 && Math.round(before.top - after.top) === 50
          && Math.abs(store.writerPosition?.left - after.left) < 1, JSON.stringify(store.writerPosition));
      pointer(header, "pointerdown", after.left + 20, after.top + 10);
      pointer(document, "pointermove", -5000, -5000);
      pointer(document, "pointerup", -5000, -5000);
      await wait(50);
      check("the window cannot be dragged off screen",
        panel().getBoundingClientRect().left === 0 && panel().getBoundingClientRect().top === 0);
      inPanel(".ctt-writer-close").click();
      fab().click();
      check("reopening puts the window back where it was left", panel().getBoundingClientRect().left === 0 && !panel().hidden);

      const fabBefore = fab().getBoundingClientRect();
      pointer(fab(), "pointerdown", fabBefore.left + 5, fabBefore.top + 5);
      pointer(document, "pointermove", fabBefore.left - 195, fabBefore.top - 95);
      pointer(document, "pointerup", fabBefore.left - 195, fabBefore.top - 95);
      fab().click();
      await wait(50);
      check("dragging the button moves it, saves it, and does not toggle the window",
        Math.round(fabBefore.left - fab().getBoundingClientRect().left) === 200 && !panel().hidden
          && Math.abs(store.writerButtonPosition?.top - fab().getBoundingClientRect().top) < 1);
      pointer(fab(), "pointerdown", 10, 10);
      pointer(document, "pointerup", 11, 11);
      fab().click();
      check("a click with a tiny movement still toggles the window", panel().hidden);
      fab().click();

      // Empty translation
      const realFetch = window.fetch;
      window.fetch = async (url, init) => {
        const prompt = JSON.parse(init.body).messages[1].content;
        if (prompt.includes("Draft to turn into English")) return reply(".");
        return realFetch(url, init);
      };
      const checksBeforeEmpty = checkCalls.length;
      await write("嗯");
      check("an empty translation is reported and not checked",
        inPanel(".ctt-send-status").textContent === "没有得到英文，请重试" && checkCalls.length === checksBeforeEmpty
          && inPanel(".ctt-send-check").hidden);
      window.fetch = realFetch;
      const emptyCheck = await checkBeforeSending({ message: "  ", context: [] }).catch((e) => e.message);
      check("the background refuses to check an empty message", emptyCheck === "没有可以检查的内容");

      // Settings
      await browser.storage.local.set({ checkBeforeSend: false });
      const checksBeforeOff = checkCalls.length;
      await write("sounds good");
      check("check turned off: no check call and no check box",
        checkCalls.length === checksBeforeOff && inPanel(".ctt-send-check").hidden);
      await browser.storage.local.set({ blockChineseOnSend: false });
      editor.innerText = "好的";
      pressIn(editor, { key: "Enter" });
      check("blocking turned off: Chinese is sent as typed", sent.at(-1) === "好的");

      document.getElementById("results").textContent = results.join("\n");
      window.testResults = results;
    }
    run();
  </script>
</body>
</html>
